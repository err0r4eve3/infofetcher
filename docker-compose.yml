name: infofetcher

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: infofetcher
      POSTGRES_USER: infofetcher
      POSTGRES_PASSWORD: reader
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infofetcher -d infofetcher"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://infofetcher:reader@postgres:5432/infofetcher
      APP_BIND: 0.0.0.0:8080
      APP_PUBLIC_URL: http://localhost:8080
      ADMIN_USERNAME: admin
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN is required}
      INTEL_API_TOKEN: ${INTEL_API_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CONTENT_RETENTION_DAYS: ${CONTENT_RETENTION_DAYS:-365}
      INDEX_DIR: /app/data/tantivy
      FETCH_CONCURRENCY: ${FETCH_CONCURRENCY:-16}
      FETCH_INTERVAL_MINUTES: ${FETCH_INTERVAL_MINUTES:-30}
      FEED_MAX_BYTES: ${FEED_MAX_BYTES:-5242880}
      ARTICLE_MAX_BYTES: ${ARTICLE_MAX_BYTES:-8388608}
      ALLOW_PRIVATE_FETCH: ${ALLOW_PRIVATE_FETCH:-false}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma-2}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://cpa1.cat-infra.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
      LLM_CONTEXT_BUDGET_CHARS: ${LLM_CONTEXT_BUDGET_CHARS:-64000}
      EVENT_AGENT_ENABLED: ${EVENT_AGENT_ENABLED:-false}
      EVENT_AGENT_INTERVAL_SECONDS: ${EVENT_AGENT_INTERVAL_SECONDS:-30}
      EVENT_AGENT_LOOKBACK_HOURS: ${EVENT_AGENT_LOOKBACK_HOURS:-24}
      EVENT_AGENT_MAX_PENDING: ${EVENT_AGENT_MAX_PENDING:-12}
      EDITORIAL_ENABLED: ${EDITORIAL_ENABLED:-false}
      EDITORIAL_INTERVAL_SECONDS: ${EDITORIAL_INTERVAL_SECONDS:-600}
      EDITORIAL_DAILY_EVENT_LIMIT: ${EDITORIAL_DAILY_EVENT_LIMIT:-600}
      EDITORIAL_THRESHOLDS: ${EDITORIAL_THRESHOLDS:-world-news:5,tech-research:5,long-read:5}
      BRIEF_SECTION_SHARES: ${BRIEF_SECTION_SHARES:-world:0.45,technology:0.3,business:0.3,security:0.2,general:0.25}
      BRIEF_EDITION_HOUR: ${BRIEF_EDITION_HOUR:-8}
      BRIEF_EDITION_UTC_OFFSET_HOURS: ${BRIEF_EDITION_UTC_OFFSET_HOURS:-8}
      BRIEF_FEED_TOKEN: ${BRIEF_FEED_TOKEN:-}
      BRIEF_WEBHOOK_URL: ${BRIEF_WEBHOOK_URL:-}
      BRIEF_WEBHOOK_FORMAT: ${BRIEF_WEBHOOK_FORMAT:-generic}
      BRIEF_TELEGRAM: ${BRIEF_TELEGRAM:-false}
      MCP_API_TOKEN: ${MCP_API_TOKEN:-}
      EVENT_AGENT_UPDATE_DEBOUNCE_SECONDS: ${EVENT_AGENT_UPDATE_DEBOUNCE_SECONDS:-1800}
      TRANSLATION_BASE_URL: ${TRANSLATION_BASE_URL:-https://cpa1.cat-infra.com/v1}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-claude-haiku-5-5}
      TRANSLATION_TIMEOUT_SECONDS: ${TRANSLATION_TIMEOUT_SECONDS:-60}
      TRANSLATION_MAX_CONCURRENCY: ${TRANSLATION_MAX_CONCURRENCY:-2}
      TRANSLATION_MAX_INPUT_CHARS: ${TRANSLATION_MAX_INPUT_CHARS:-60000}
      TRANSLATION_CHUNK_CHARS: ${TRANSLATION_CHUNK_CHARS:-6000}
      TRANSLATION_MAX_OUTPUT_TOKENS: ${TRANSLATION_MAX_OUTPUT_TOKENS:-8192}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ARTICLE_FETCH_COOKIES_JSON: '${ARTICLE_FETCH_COOKIES_JSON:-{}}'
      OPENCLI_BIN: ${OPENCLI_BIN:-opencli}
      OPENCLI_FEEDS_JSON: '${OPENCLI_FEEDS_JSON:-{}}'
      OPENCLI_ACCESS_TOKEN: ${OPENCLI_ACCESS_TOKEN:-}
      OPENCLI_MAX_CONCURRENCY: ${OPENCLI_MAX_CONCURRENCY:-1}
      RSSHUB_BASE_URL: ${RSSHUB_BASE_URL:-}
      WEB_WATCHES_JSON: '${WEB_WATCHES_JSON:-{}}'
      WEBSUB_ENABLED: ${WEBSUB_ENABLED:-false}
      WEBSUB_LEASE_SECONDS: ${WEBSUB_LEASE_SECONDS:-604800}
      BROWSER_FETCH_ENABLED: ${BROWSER_FETCH_ENABLED:-false}
      BROWSER_FETCH_BIN: ${BROWSER_FETCH_BIN:-chromium}
      BROWSER_FETCH_USER_DATA_DIR: ${BROWSER_FETCH_USER_DATA_DIR:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - index-data:/app/data

volumes:
  postgres-data:
  index-data:
