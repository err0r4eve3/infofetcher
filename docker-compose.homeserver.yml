services:
  rsshub:
    image: ghcr.io/diygod/rsshub:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${HOST_RSSHUB_PORT:-11200}:1200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # 标题向量服务（EmbeddingGemma 2 Q8_0，只加载文本部分），供事件层跨语言召回。
  embedding:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:89f180f16f295ee496fe00924ec2118cae2efec519d1a82c605420af09d2a6df
    restart: unless-stopped
    command:
      - "-hf"
      - "ggml-org/embeddinggemma-2-GGUF:Q8_0"
      - "--no-mmproj"
      - "--embeddings"
      - "--pooling"
      - "mean"
      - "-c"
      - "2048"
      - "-b"
      - "2048"
      - "-ub"
      - "2048"
      - "--threads"
      - "2"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    ports:
      - "127.0.0.1:${HOST_EMBEDDING_PORT:-18182}:8080"
    volumes:
      - embedding-models:/root/.cache/huggingface
    cpus: 2
    mem_limit: 2g

  # OSINT 联网检索。GDELT DOC API 对所有来源持续 429（2026-10-21 实测），改用自建 SearXNG。
  searxng:
    image: searxng/searxng@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is required}
    ports:
      - "127.0.0.1:${HOST_SEARXNG_PORT:-18183}:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    cpus: 1
    mem_limit: 512m

  postgres:
    ports: !override
      - "127.0.0.1:${HOST_PG_PORT:-15432}:5432"

  api:
    build:
      dockerfile: apps/api/Dockerfile.homeserver
    network_mode: host
    environment:
      APP_BIND: "127.0.0.1:${HOST_API_PORT:-18181}"
      DATABASE_URL: "postgres://infofetcher:reader@127.0.0.1:${HOST_PG_PORT:-15432}/infofetcher"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CONTENT_RETENTION_DAYS: ${CONTENT_RETENTION_DAYS:-365}
      EVENT_AGENT_ENABLED: ${EVENT_AGENT_ENABLED:-true}
      EVENT_AGENT_INTERVAL_SECONDS: ${EVENT_AGENT_INTERVAL_SECONDS:-30}
      EVENT_AGENT_LOOKBACK_HOURS: ${EVENT_AGENT_LOOKBACK_HOURS:-24}
      EVENT_AGENT_MAX_PENDING: ${EVENT_AGENT_MAX_PENDING:-12}
      WEBSUB_ENABLED: ${WEBSUB_ENABLED:-true}
      RSSHUB_BASE_URL: "http://127.0.0.1:${HOST_RSSHUB_PORT:-11200}"
      OPENCLI_TIMEOUT_SECONDS: ${OPENCLI_TIMEOUT_SECONDS:-90}
      OSINT_SEARXNG_URL: ${OSINT_SEARXNG_URL:-http://127.0.0.1:${HOST_SEARXNG_PORT:-18183}}
    depends_on:
      postgres:
        condition: service_healthy
      rsshub:
        condition: service_healthy
    ports: !reset []

volumes:
  embedding-models:
