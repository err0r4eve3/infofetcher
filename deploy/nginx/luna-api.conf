server {
    listen 80;
    listen [::]:80;
    server_name luna-api.error.moe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:9445 ssl;
    http2 on;
    server_name luna-api.error.moe;

    ssl_certificate /etc/letsencrypt/live/luna-api.error.moe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luna-api.error.moe/privkey.pem;

    client_max_body_size 8m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8327;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /v1/models {
        proxy_pass http://127.0.0.1:8327;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /v1/chat/completions {
        proxy_pass http://127.0.0.1:8327;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
